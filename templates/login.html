{% extends "layout.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <div class="card cyber-card text-center p-4 mt-5">
            <h2 class="cyber-text mb-4">ВХОД В СИСТЕМУ</h2>
            {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
            {% endif %}
            <form method="POST">
                <div class="mb-3">
                    <input type="text" name="student_name" class="form-control bg-dark text-white border-secondary text-center" placeholder="Введите ваше имя" required autofocus>
                </div>
                <button type="submit" class="btn btn-outline-success w-100 fw-bold">АВТОРИЗАЦИЯ</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
